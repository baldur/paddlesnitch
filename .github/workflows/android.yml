name: Android

# The Android app (mobile/android, docs/features/android-app.md): unit tests
# and a debug APK on every change to the app or the shared contract it is
# generated from. The release APK is signed with the upload key once the
# ANDROID_UPLOAD_* secrets exist; until then it is skipped. The release
# bundle (.aab) beside it is what goes to Google Play (mobile/android/PLAY-RELEASE.md).
on:
  pull_request:
    paths: ['mobile/android/**', 'mobile/contract/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['mobile/android/**', 'mobile/contract/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: android build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # Unit tests, the Compose UI tests (Robolectric) and the screenshot
      # goldens in app/src/test/screenshots (Roborazzi), which fail on any change.
      - name: Unit, UI and screenshot tests
        run: ./gradlew --no-configuration-cache :app:verifyRoborazziDebug
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshot-diffs
          path: mobile/android/app/build/outputs/roborazzi
          retention-days: 14
      # Release declares exactly releasePermissions (app/build.gradle.kts), no location.
      - name: Release permissions
        run: ./gradlew --no-configuration-cache :app:checkReleasePermissions
      - name: Debug APK
        run: ./gradlew --no-configuration-cache :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: paddlesnitch-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
      # The APK is for paddlesnitch.com/android; Play takes only the bundle (.aab).
      - name: Release APK and bundle (signed with the upload key)
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          PS_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          PS_UPLOAD_KEY_ALIAS: upload   # the key's name in the keystore; not a secret
          PS_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          PS_VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          PS_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks" ./gradlew --no-configuration-cache :app:assembleRelease :app:bundleRelease
          rm "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v7
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: paddlesnitch-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: paddlesnitch-release-bundle
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

  # paddlesnitch.com/android/download (apps/web/src/lib/android-download.ts)
  # points at this release's file, so a merge to main is what people download.
  # A job of its own so only pushes to main ever hold a token that can write.
  publish:
    name: publish APK for paddlesnitch.com/android
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: android-latest
      APK_NAME: paddlesnitch.apk
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: paddlesnitch-release-apk
          path: apk
      - name: Publish
        run: |
          cp apk/*.apk "$APK_NAME"
          notes="Android app built from ${GITHUB_SHA::7} (build ${GITHUB_RUN_NUMBER}). Install it from https://paddlesnitch.com/android"
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_NAME" --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --notes "$notes" -R "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$APK_NAME" --prerelease --title "Android app (latest)" --notes "$notes" --target "$GITHUB_SHA" -R "$GITHUB_REPOSITORY"
          fi
