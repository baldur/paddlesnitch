name: Android

# The Android app (mobile/android, docs/features/android-app.md): unit tests
# and a debug APK on every change to the app or the shared contract it is
# generated from. The release APK is signed with the upload key once the
# ANDROID_UPLOAD_* secrets exist; until then it is skipped.
on:
  pull_request:
    paths: ['mobile/android/**', 'mobile/contract/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['mobile/android/**', 'mobile/contract/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: android build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # Unit tests, the Compose UI tests (Robolectric) and the screenshot
      # goldens in app/src/test/screenshots (Roborazzi), which fail on any change.
      - name: Unit, UI and screenshot tests
        run: ./gradlew --no-configuration-cache :app:verifyRoborazziDebug
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshot-diffs
          path: mobile/android/app/build/outputs/roborazzi
          retention-days: 14
      - name: Debug APK
        run: ./gradlew --no-configuration-cache :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: paddlesnitch-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Release APK (signed with the upload key)
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          PS_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          PS_UPLOAD_KEY_ALIAS: upload   # the key's name in the keystore; not a secret
          PS_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          PS_VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          PS_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks" ./gradlew --no-configuration-cache :app:assembleRelease
          rm "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v7
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: paddlesnitch-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
