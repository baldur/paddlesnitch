name: iOS

# The iPhone app (mobile/ios, docs/features/ios-app.md). Build and test only:
# no signing and no secrets until the Developer Program (P5). Every step is a
# `make` target, so CI runs exactly what `make test` runs locally.
on:
  pull_request:
    paths:
      - 'mobile/ios/**'
      - 'mobile/contract/**'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/ios/**'
      - 'mobile/contract/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile/ios

jobs:
  packages:
    name: iOS packages + lint
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install tools
        run: brew install swiftlint
      - name: Lint
        run: make lint
      # Includes the check that generated Swift matches mobile/contract/.
      - name: Package tests
        run: make test-packages

  app:
    # Two jobs per iOS version, each half the UI tests (Makefile, SHARD), so
    # the slowest check takes about half as long. Two, not three: a public
    # repo runs 5 macOS jobs at once, and this is 4 plus the packages job.
    name: iOS app (${{ matrix.name }}, ${{ matrix.shard }} of 2)
    runs-on: macos-26
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        ios: [latest, '17']
        shard: [1, 2]
        include:
          - name: newest iOS
            ios: latest
          # The supported floor. Runner images don't include an iOS 17
          # simulator, so this job downloads one (several minutes).
          - name: iOS 17
            ios: '17'
            download: '17.5'
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install tools
        run: brew install xcodegen
      - name: Download the iOS ${{ matrix.download }} simulator
        if: matrix.download
        # Apple's download fails now and then (exit 70); try three times.
        run: |
          for attempt in 1 2 3; do
            xcodebuild -downloadPlatform iOS -buildVersion ${{ matrix.download }} && exit 0
            echo "Download attempt $attempt failed; retrying in 30 s"
            sleep 30
          done
          exit 1
      - name: App tests
        run: make test-app IOS=${{ matrix.ios }} SHARD=${{ matrix.shard }}
      - name: Keep the test results
        # Also when the job's timeout cancels it: that's when they're needed most.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results-${{ matrix.ios }}-${{ matrix.shard }}
          # Crash reports from the simulator land in the runner's own logs.
          path: |
            mobile/ios/.build/DerivedData/Logs/Test
            ~/Library/Logs/DiagnosticReports/Paddlesnitch*
          retention-days: 7
