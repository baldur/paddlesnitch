name: Firmware build & release

# MERGING RELEASES. EVERY push to main promotes the latest firmware to stable,
# so devices pick it up on their next sync.
#
#   push to main touching firmware/**  -> build, publish, promote to stable
#   any other push to main             -> promote firmware/VERSION if it is not
#                                         already current (no build)
#   workflow_dispatch with a version   -> promote any ALREADY-BUILT version.
#                                         This is the rollback lever.
#
# Why every push and not only firmware/** ones: a promote that failed or was
# skipped used to stay missed until the next firmware change. That is how 0.14.0
# sat published-but-unpromoted -- the fix (#276) only touched this workflow,
# which is outside firmware/**, so nothing re-ran and a device stayed on 0.12.0.
#
# The one thing a merge will NOT do is undo a rollback: if stable was set by
# hand after firmware/VERSION was built, the merge skips (see
# .github/scripts/firmware-promote-decision.sh). Bump VERSION to supersede it.
#
# This used to require a separate manual promote, on the reasoning that one bad
# merge would otherwise reach every tracker at once. The reasoning was sound but
# the gate was in the wrong place for how this repo actually works: firmware is
# flashed and tested by cable BEFORE the PR is merged, so by merge time the
# decision to release has already been made with a device in hand. A second
# confirmation of a decision already taken is ceremony, and ceremony gets
# skipped or forgotten -- 0.13.0 sat published-but-invisible for exactly that
# reason.
#
# WHAT NOW STANDS BETWEEN A BAD MERGE AND A DEAD DEVICE, in order:
#   1. Flashing and testing on hardware before opening the PR.
#   2. The VERSION-bump guard and the never-overwrite guard below.
#   3. THE APP-LEVEL ROLLBACK IN THE FIRMWARE -- three failed boots and the
#      device puts the old image back (src/ota.cpp, otaBootCheck).
#
# (3) is now load-bearing rather than a backstop. Removing the human gate moves
# the weight onto the automatic one, so a broken-image rollback test is not
# optional before this points at devices in other people's hands.
#
# Staged rollout is deliberately NOT built here. The channel mechanism already
# supports it -- the server reads firmware/channels/<channel>.json and this
# workflow can already write `beta` -- so when there are enough devices to make
# it meaningful, the change is to have some devices ask for `beta` and to point
# the auto-promote at that channel instead.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to promote (must already be built). Use this to ROLL BACK.'
        required: true
        type: string
      channel:
        description: 'Channel'
        required: true
        default: 'stable'
        type: choice
        options: [stable, beta]

permissions:
  id-token: write        # OIDC — no long-lived AWS keys in secrets
  contents: read

env:
  AWS_REGION: eu-west-1
  DATA_BUCKET: paddlesnitch-data-prod

# Two merges in quick succession must not race each other's promote.
concurrency:
  group: firmware-release
  cancel-in-progress: false

jobs:
  # The trigger no longer filters on firmware/**, so decide here whether this
  # push needs a BUILD. Every push still reaches promote.
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.d.outputs.firmware }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: d
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE="HEAD^"
          fi
          if git diff --name-only "$BEFORE" HEAD | grep -q '^firmware/'; then
            echo "firmware=true" >> "$GITHUB_OUTPUT"
          else
            echo "firmware=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [changes]
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write    # OIDC, as for the whole workflow
      contents: write    # push the fw/vX.Y.Z tag; nothing else in here writes
    steps:
      - uses: actions/checkout@v5
        with:
          # Need the previous commit to tell whether VERSION moved with the source.
          fetch-depth: 2

      - name: Read version
        id: v
        run: |
          VERSION="$(tr -d '[:space:]' < firmware/VERSION)"
          if [ -z "$VERSION" ]; then echo "firmware/VERSION is empty"; exit 1; fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "firmware/VERSION is not a semver: $VERSION"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The guard that makes VERSION worth having. Firmware changed but the
      # version did not means two different binaries would claim to be the same
      # build — and a device already running that number would never take the
      # update, because "current == channel" is the whole comparison.
      - name: Refuse a source change that forgot to bump VERSION
        id: src
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q '^firmware/src/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            if git diff --quiet HEAD^ HEAD -- firmware/VERSION; then
              echo "::error::firmware/src changed but firmware/VERSION did not (still ${{ steps.v.outputs.version }}). Bump it."
              exit 1
            fi
          else
            # A docs-only change under firmware/ -- firmware/CLAUDE.md, docs/,
            # tools/. The binary is unchanged, so VERSION rightly did not move.
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Every version shows its note on the tracker once, after it updates. A
      # note left over from the previous version would describe the wrong change.
      - name: Refuse a new version without a new release note
        run: |
          bash .github/scripts/firmware-notes.test.sh
          if ! git diff --quiet HEAD^ HEAD -- firmware/VERSION && git diff --quiet HEAD^ HEAD -- firmware/NOTES; then
            echo "::error::firmware/VERSION changed but firmware/NOTES did not. Write what changed, for the person holding the tracker."
            exit 1
          fi
          bash .github/scripts/firmware-notes.sh firmware/NOTES

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install --upgrade platformio

      - name: Build tracker
        working-directory: firmware
        run: pio run -e tracker

      # Cheap and it has already caught a real bug class: the host tests exist
      # because a wrong track-vs-sidecar predicate cost a full debugging session.
      - name: Host tests
        working-directory: firmware
        run: pio test -e native

      - name: Build manifest
        id: m
        working-directory: firmware
        run: |
          BIN=.pio/build/tracker/firmware.bin
          test -f "$BIN" || { echo "no firmware.bin at $BIN"; exit 1; }
          SHA="$(sha256sum "$BIN" | cut -d' ' -f1)"
          SIZE="$(stat -c%s "$BIN")"
          NOTES="$(bash ../.github/scripts/firmware-notes.sh NOTES)"
          jq -n --arg v "${{ steps.v.outputs.version }}" --arg s "$SHA" \
                --argjson n "$SIZE" --arg notes "$NOTES" \
                --arg built "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg sha "$GITHUB_SHA" \
            '{version:$v, sha256:$s, sizeBytes:$n, notes:$notes, builtAt:$built, gitSha:$sha}' \
            > manifest.json
          cat manifest.json
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE"  >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Refuse to overwrite a version that already exists. Once a build is
      # published, some device may already be running it; replacing the bytes
      # under a version number makes every record of that version a lie.
      # Never overwrite published bytes -- some device may already be running
      # them, and replacing them under the same version number makes every
      # record of that version a lie.
      #
      # But "already published" is only an ERROR when the source actually
      # changed. A docs-only change under firmware/ (CLAUDE.md, docs/, tools/)
      # legitimately keeps the same VERSION and rebuilds the same binary, and
      # failing that was a self-inflicted wound: it turned every firmware docs
      # edit into a red build AND -- because promote needs build -- silently
      # skipped the release. That is exactly how merging the auto-promote change
      # itself failed to promote anything.
      - name: Publish (never overwrite)
        working-directory: firmware
        run: |
          V="${{ steps.v.outputs.version }}"
          if aws s3api head-object --bucket "$DATA_BUCKET" --key "firmware/$V/firmware.bin" >/dev/null 2>&1; then
            if [ "${{ steps.src.outputs.changed }}" = "true" ]; then
              echo "::error::firmware/$V already published but firmware/src changed -- that would overwrite different bytes under a published version. Bump firmware/VERSION."
              exit 1
            fi
            echo "firmware/$V already published and src is unchanged -- keeping the published bytes."
            echo "PUBLISHED_NOW=false" >> "$GITHUB_ENV"
            exit 0
          fi
          aws s3 cp .pio/build/tracker/firmware.bin "s3://$DATA_BUCKET/firmware/$V/firmware.bin"
          aws s3 cp manifest.json "s3://$DATA_BUCKET/firmware/$V/manifest.json"
          echo "PUBLISHED_NOW=true" >> "$GITHUB_ENV"

      # A git tag per published version (fw/v0.16.2), on the commit that was
      # built, so "what code is 0.16.2?" is one `git show fw/v0.16.2` away.
      # Only for a version published by THIS run: a docs-only rebuild keeps the
      # bytes published earlier, which were built from an earlier commit. The
      # tag message is the note the tracker shows. A tag that already exists is
      # left where it is (tags are never moved).
      - name: Tag the release
        if: env.PUBLISHED_NOW == 'true'
        run: |
          bash .github/scripts/release-tag.test.sh
          TAG="$(bash .github/scripts/release-tag.sh fw "${{ steps.v.outputs.version }}")"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists -- leaving it."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "$(bash .github/scripts/firmware-notes.sh firmware/NOTES)"
          git push origin "refs/tags/$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Summary
        run: |
          {
            echo "### Firmware ${{ steps.v.outputs.version }} built"
            [ -n "${TAG:-}" ] && echo "" && echo "- tag: \`$TAG\`"
            echo ""
            echo "- size: ${{ steps.m.outputs.size }} bytes"
            echo "- sha256: \`${{ steps.m.outputs.sha256 }}\`"
            echo ""
            echo "Promoting to **stable** next — devices take it on their next sync."
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    # Both paths land here: a merge promotes what it just built, and a manual
    # run promotes whatever version you name. One implementation, so the
    # rollback lever cannot drift from the thing that does the releasing.
    #
    # `always()` because `build` is SKIPPED on a manual run, and a skipped
    # dependency would otherwise skip this too.
    #
    # On a push, build is SKIPPED when no firmware changed -- that still
    # promotes, because the point is that every merge lands the latest build.
    # A FAILED build does not promote.
    needs: [changes, build]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.changes.result == 'success' &&
        (needs.build.result == 'success' || needs.build.result == 'skipped')))
    runs-on: ubuntu-latest
    # No `environment:` gate. It would prompt for approval on every merge, which
    # is exactly the step this change removes. If devices ever ship to people who
    # cannot reach them with a cable, put it back on the auto path -- NOT on the
    # manual one, which is the rollback and must stay fast.
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Promoting a version whose bytes are missing would turn every device's
      # next sync into a failed download, so check BOTH objects first.
      - name: Resolve what to promote
        id: t
        run: |
          # A merge promotes what it just built; a manual run promotes the named
          # version. Channel defaults to stable on the merge path.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "channel=${{ inputs.channel }}" >> "$GITHUB_OUTPUT"
            echo "how=manual" >> "$GITHUB_OUTPUT"
          else
            # Read VERSION from the checkout, not from build's output: build is
            # skipped on a push that did not touch firmware/.
            echo "version=$(tr -d '[:space:]' < firmware/VERSION)" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "how=merge" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the build exists
        run: |
          V="${{ steps.t.outputs.version }}"
          printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "::error::not a semver: $V"; exit 1; }
          aws s3api head-object --bucket "$DATA_BUCKET" --key "firmware/$V/firmware.bin"   >/dev/null
          aws s3api head-object --bucket "$DATA_BUCKET" --key "firmware/$V/manifest.json" >/dev/null

      # Merge path only. A manual run is an explicit decision (usually a
      # rollback) and always goes through.
      - name: Decide
        id: d
        run: |
          if [ "${{ steps.t.outputs.how }}" = "manual" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          bash .github/scripts/firmware-promote-decision.test.sh
          V="${{ steps.t.outputs.version }}"
          C="${{ steps.t.outputs.channel }}"
          aws s3 cp "s3://$DATA_BUCKET/firmware/$V/manifest.json" manifest.json --quiet
          if aws s3 cp "s3://$DATA_BUCKET/firmware/channels/$C.json" current.json --quiet 2>/dev/null; then
            CUR=current.json
          else
            CUR=-
          fi
          DECISION="$(bash .github/scripts/firmware-promote-decision.sh "$V" "$CUR" manifest.json)"
          echo "$DECISION"
          echo "- $DECISION" >> "$GITHUB_STEP_SUMMARY"
          if [ "${DECISION%% *}" = "promote" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi

      - name: Promote
        if: steps.d.outputs.go == 'true'
        run: |
          V="${{ steps.t.outputs.version }}"
          C="${{ steps.t.outputs.channel }}"
          jq -n --arg v "$V" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             --arg by "${{ github.actor }}" --arg how "${{ steps.t.outputs.how }}" \
            '{version:$v, promotedAt:$at, promotedBy:$by, via:$how}' > channel.json
          aws s3 cp channel.json "s3://$DATA_BUCKET/firmware/channels/$C.json"
          {
            echo "### Released $V to $C"
            echo ""
            echo "Devices take it on their next sync (~5 min, plus up to 60 s of channel cache)."
            echo "A device with nothing to upload makes no request, so it finds this via its"
            echo "hourly probe instead — power-cycle one to see it immediately."
            echo ""
            echo "**To roll back:** run this workflow manually with the previous version."
            echo "Watch \`paddlesnitch-firmware\` — any \`FirmwareBootFailed\` is the signal."
          } >> "$GITHUB_STEP_SUMMARY"
