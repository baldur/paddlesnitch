name: Waterways refresh

# Weekly rebuild of the river planner's UK, Ireland, Netherlands and Belgium data
# (docs/features/waterways-uk-ireland.md): OSM from Geofabrik plus every
# source's normalised features, the check routes, then a new version uploaded
# to S3 and a PR pointing packages/waterways/data/manifest.json at it. Nothing
# goes live until a person merges that PR. Off the hour: scheduled runs on the
# hour get delayed or dropped.
on:
  schedule:
    - cron: '17 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write        # the fallback when Actions may not open PRs
  actions: write       # to dispatch the checks on the PR branch
  id-token: write      # for the AWS role

concurrency:
  group: waterways-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The AWS role (att-github-waterways) trusts only this environment, and can
    # only touch waterways/* in the data bucket (infra/lib/att-stack.ts).
    environment: waterways-data
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pyosmium
        run: pip install osmium

      # One extract per country group; the build reads each (build-national.ts, EXTRACTS).
      - name: Download the OSM extracts (Britain and Ireland, the Netherlands, Belgium)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gbie.osm.pbf" https://download.geofabrik.de/europe/britain-and-ireland-latest.osm.pbf
          curl -sSfL -o "$RUNNER_TEMP/nl.osm.pbf" https://download.geofabrik.de/europe/netherlands-latest.osm.pbf
          curl -sSfL -o "$RUNNER_TEMP/be.osm.pbf" https://download.geofabrik.de/europe/belgium-latest.osm.pbf

      - name: Extract rivers, canals, points and places
        working-directory: apps/web
        run: |
          python scripts/waterways/osm_extract.py "$RUNNER_TEMP/gbie.osm.pbf" .cache/waterways/osm/gbie
          python scripts/waterways/osm_extract.py "$RUNNER_TEMP/nl.osm.pbf" .cache/waterways/osm/nl
          python scripts/waterways/osm_extract.py "$RUNNER_TEMP/be.osm.pbf" .cache/waterways/osm/be
          rm "$RUNNER_TEMP"/*.osm.pbf   # ~3 GB the runner's disk can do without

      # The waterways role sits beside the deploy role in the same account.
      - name: Work out the waterways role
        id: role
        env:
          DEPLOY_ROLE: ${{ secrets.AWS_ROLE_ARN }}
        run: echo "arn=${DEPLOY_ROLE%%:role/*}:role/att-github-waterways" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: eu-west-1

      # A source that fails or shrinks falls back to its last good copy in S3
      # (waterways/normalised/) instead of dropping out; health.json says which.
      - name: Normalise sources
        working-directory: apps/web
        env:
          DATA_BUCKET: paddlesnitch-data-prod
        run: pnpm waterways:sources --stage | tee "$RUNNER_TEMP/sources.log"

      - name: Flag sources failing three runs in a row
        if: always()
        working-directory: apps/web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 3 = FAILING_RUNS in packages/waterways/src/health.ts.
          [ -f .cache/waterways/health.json ] || exit 0
          for name in $(node -e "const h=require('./.cache/waterways/health.json');console.log(Object.entries(h.sources).filter(([,s])=>s.failures>=3).map(([n])=>n).join(' '))"); do
            title="Waterways source $name is failing"
            if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number')" ]; then
              { echo "The weekly refresh hasn't had a fresh copy of \`$name\` for three runs; it's publishing the last good one (or none)."; echo
                echo '```'; grep -E "^\s+$name:" "$RUNNER_TEMP/sources.log"; echo '```'; echo
                echo "Fix its job in \`apps/web/scripts/waterways/fetch-sources.ts\`. Close this once a run's data PR shows \`$name: ok\`."; } > "$RUNNER_TEMP/failing.md"
              gh issue create --title "$title" --body-file "$RUNNER_TEMP/failing.md"
            fi
          done

      # Rijkswaterstaat's predicted Dutch high and low waters, published with the
      # version as tides-nl. Without them the planner falls back to our own fits.
      - name: Fetch Dutch tide predictions
        working-directory: apps/web
        # Capped: 80 requests at up to 2 minutes each could outlast the job if RWS hung.
        run: timeout 600 pnpm exec tsx scripts/waterways/fetch-rws-tide-extremes.ts || echo "::warning::Dutch tide predictions not fetched; this version has none"

      - name: Build and check (no upload)
        working-directory: apps/web
        run: pnpm waterways:national | tee "$RUNNER_TEMP/build.log"

      - name: Publish a new version
        working-directory: apps/web
        env:
          DATA_BUCKET: paddlesnitch-data-prod
        run: pnpm waterways:national --publish | tee -a "$RUNNER_TEMP/build.log"

      - name: Open a PR to make it live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./packages/waterways/data/manifest.json').version")
          branch="waterways/refresh-$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Branch from main as it is now, not the commit this run started on:
          # if main moved meanwhile (a workflow file among the changes), a branch
          # cut from the old commit is refused ("refusing to allow a GitHub App
          # to create or update workflow … without workflows permission").
          cp packages/waterways/data/manifest.json "$RUNNER_TEMP/manifest.json"
          git fetch --quiet origin main
          git switch -c "$branch" origin/main
          cp "$RUNNER_TEMP/manifest.json" packages/waterways/data/manifest.json
          git add packages/waterways/data/manifest.json
          git commit -m "data(waterways): publish $version"
          git push -u origin "$branch"
          {
            echo "Weekly rebuild of the river planner's UK, Ireland, Netherlands and Belgium data. Merging makes version \`$version\` live."
            echo
            echo '```'
            grep -E '^\s+(network|OSM|features|places|✓|✗|wrote)' "$RUNNER_TEMP/build.log" | head -60
            echo '```'
            echo
            echo 'Sources:'
            echo '```'
            cat "$RUNNER_TEMP/sources.log"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          if gh pr create --title "data(waterways): publish $version" --body-file "$RUNNER_TEMP/body.md" --head "$branch" --base main; then
            # A PR opened with GITHUB_TOKEN doesn't start pull_request runs.
            gh workflow run checks.yml --ref "$branch"
            gh workflow run e2e.yml --ref "$branch"
          else
            # The repo setting "Allow GitHub Actions to create and approve pull
            # requests" is off: ask a person to open it (their PR runs checks).
            { echo "The weekly waterways refresh published \`$version\` but may not open PRs itself."; echo;
              echo "Open the PR: https://github.com/${{ github.repository }}/compare/main...$branch?expand=1"; echo; cat "$RUNNER_TEMP/body.md"; } > "$RUNNER_TEMP/issue.md"
            gh issue create --title "Waterways data $version is ready to publish" --body-file "$RUNNER_TEMP/issue.md"
          fi

  # Looking for improved data: one digest issue a week of new datasets about
  # locks, weirs, slipways, canoe access and the like on data.gov.ie,
  # OpenDataNI and ArcGIS Online (packages/waterways/src/discovery.ts).
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Search the catalogues
        working-directory: apps/web
        run: pnpm waterways:discover --days 8 --out "$RUNNER_TEMP/discover.md"

      - name: Post the digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s "$RUNNER_TEMP/discover.md" ] || { echo "Nothing new this week."; exit 0; }
          gh issue create --title "Waterways data: new candidate sources $(date -u +%Y-%m-%d)" --body-file "$RUNNER_TEMP/discover.md"
