name: Waterways refresh

# Weekly rebuild of the river planner's UK and Ireland data
# (docs/features/waterways-uk-ireland.md): OSM from Geofabrik plus every
# source's normalised features, the check routes, then a new version uploaded
# to S3 and a PR pointing packages/waterways/data/manifest.json at it. Nothing
# goes live until a person merges that PR. Off the hour: scheduled runs on the
# hour get delayed or dropped.
on:
  schedule:
    - cron: '17 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write        # the fallback when Actions may not open PRs
  actions: write       # to dispatch the checks on the PR branch
  id-token: write      # for the AWS role

concurrency:
  group: waterways-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The AWS role (att-github-waterways) trusts only this environment, and can
    # only touch waterways/* in the data bucket (infra/lib/att-stack.ts).
    environment: waterways-data
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pyosmium
        run: pip install osmium

      - name: Download the OSM extract (Britain and Ireland)
        run: curl -sSfL -o "$RUNNER_TEMP/gbie.osm.pbf" https://download.geofabrik.de/europe/britain-and-ireland-latest.osm.pbf

      - name: Extract rivers, canals, points and places
        working-directory: apps/web
        run: python scripts/waterways/osm_extract.py "$RUNNER_TEMP/gbie.osm.pbf" .cache/waterways/osm/gbie

      - name: Normalise sources
        working-directory: apps/web
        run: pnpm waterways:sources

      - name: Build and check (no upload)
        working-directory: apps/web
        run: pnpm waterways:national | tee "$RUNNER_TEMP/build.log"

      # The waterways role sits beside the deploy role in the same account.
      - name: Work out the waterways role
        id: role
        env:
          DEPLOY_ROLE: ${{ secrets.AWS_ROLE_ARN }}
        run: echo "arn=${DEPLOY_ROLE%%:role/*}:role/att-github-waterways" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: eu-west-1

      - name: Publish a new version
        working-directory: apps/web
        env:
          DATA_BUCKET: paddlesnitch-data-prod
        run: pnpm waterways:national --publish | tee -a "$RUNNER_TEMP/build.log"

      - name: Open a PR to make it live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./packages/waterways/data/manifest.json').version")
          branch="waterways/refresh-$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add packages/waterways/data/manifest.json
          git commit -m "data(waterways): publish $version"
          git push -u origin "$branch"
          {
            echo "Weekly rebuild of the river planner's UK and Ireland data. Merging makes version \`$version\` live."
            echo
            echo '```'
            grep -E '^\s+(network|OSM|features|places|✓|✗|wrote)' "$RUNNER_TEMP/build.log" | head -60
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          if gh pr create --title "data(waterways): publish $version" --body-file "$RUNNER_TEMP/body.md" --head "$branch" --base main; then
            # A PR opened with GITHUB_TOKEN doesn't start pull_request runs.
            gh workflow run checks.yml --ref "$branch"
            gh workflow run e2e.yml --ref "$branch"
          else
            # The repo setting "Allow GitHub Actions to create and approve pull
            # requests" is off: ask a person to open it (their PR runs checks).
            { echo "The weekly waterways refresh published \`$version\` but may not open PRs itself."; echo;
              echo "Open the PR: https://github.com/${{ github.repository }}/compare/main...$branch?expand=1"; echo; cat "$RUNNER_TEMP/body.md"; } > "$RUNNER_TEMP/issue.md"
            gh issue create --title "Waterways data $version is ready to publish" --body-file "$RUNNER_TEMP/issue.md"
          fi
