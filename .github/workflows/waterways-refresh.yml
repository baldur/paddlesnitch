name: Waterways refresh

# Weekly rebuild of the river planner's UK, Ireland, Netherlands, Belgium, France, Germany, Austria, Switzerland, Denmark and Sweden data
# (docs/features/waterways-uk-ireland.md): OSM from Geofabrik plus every
# source's normalised features, the check routes, then a new version uploaded
# to S3. That version is read back the way the server loads it and checked
# again (routes and memory); only if it passes does the run commit
# packages/waterways/data/manifest.json to main and start the deploy. No person
# in the loop: any failure opens an issue and the site keeps the version it has.
# Off the hour: scheduled runs on the hour get delayed or dropped.
on:
  schedule:
    - cron: '17 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write      # to commit the manifest to main
  issues: write        # to report a failed run
  actions: write       # to start the deploy
  id-token: write      # for the AWS role

concurrency:
  group: waterways-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # the extracts alone take ~90 minutes
    # The AWS role (att-github-waterways) trusts only this environment, and can
    # only touch waterways/* in the data bucket (infra/lib/att-stack.ts).
    environment: waterways-data
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pyosmium
        run: pip install osmium

      # One extract per country group; the build reads each (build-national.ts,
      # EXTRACTS). Downloaded, extracted and deleted one at a time: together
      # they're ~9 GB, most of the runner's free disk.
      - name: Download and extract the OSM extracts (Britain and Ireland, the Netherlands, Belgium, France, Germany, Austria, Switzerland, Denmark, Sweden)
        working-directory: apps/web
        run: |
          for x in gbie:britain-and-ireland nl:netherlands be:belgium fr:france de:germany at:austria ch:switzerland dk:denmark se:sweden; do
            id="${x%%:*}"; name="${x#*:}"
            curl -sSfL -o "$RUNNER_TEMP/$id.osm.pbf" "https://download.geofabrik.de/europe/$name-latest.osm.pbf"
            python scripts/waterways/osm_extract.py "$RUNNER_TEMP/$id.osm.pbf" ".cache/waterways/osm/$id"
            rm "$RUNNER_TEMP/$id.osm.pbf"
          done

      # The waterways role sits beside the deploy role in the same account.
      - name: Work out the waterways role
        id: role
        env:
          DEPLOY_ROLE: ${{ secrets.AWS_ROLE_ARN }}
        run: echo "arn=${DEPLOY_ROLE%%:role/*}:role/att-github-waterways" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.role.outputs.arn }}
          aws-region: eu-west-1

      # A source that fails or shrinks falls back to its last good copy in S3
      # (waterways/normalised/) instead of dropping out; health.json says which.
      - name: Normalise sources
        working-directory: apps/web
        env:
          DATA_BUCKET: paddlesnitch-data-prod
        run: pnpm waterways:sources --stage | tee "$RUNNER_TEMP/sources.log"

      - name: Flag sources failing three runs in a row
        if: always()
        working-directory: apps/web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 3 = FAILING_RUNS in packages/waterways/src/health.ts.
          [ -f .cache/waterways/health.json ] || exit 0
          for name in $(node -e "const h=require('./.cache/waterways/health.json');console.log(Object.entries(h.sources).filter(([,s])=>s.failures>=3).map(([n])=>n).join(' '))"); do
            title="Waterways source $name is failing"
            if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[].number')" ]; then
              { echo "The weekly refresh hasn't had a fresh copy of \`$name\` for three runs; it's publishing the last good one (or none)."; echo
                echo '```'; grep -E "^\s+$name:" "$RUNNER_TEMP/sources.log"; echo '```'; echo
                echo "Fix its job in \`apps/web/scripts/waterways/fetch-sources.ts\`. Close this once a run's data PR shows \`$name: ok\`."; } > "$RUNNER_TEMP/failing.md"
              gh issue create --title "$title" --body-file "$RUNNER_TEMP/failing.md"
            fi
          done

      # Rijkswaterstaat's predicted Dutch high and low waters, published with the
      # version as tides-nl. Without them the planner falls back to our own fits.
      - name: Fetch Dutch tide predictions
        working-directory: apps/web
        # Capped: 80 requests at up to 2 minutes each could outlast the job if RWS hung.
        run: timeout 600 pnpm exec tsx scripts/waterways/fetch-rws-tide-extremes.ts || echo "::warning::Dutch tide predictions not fetched; this version has none"

      - name: Build and check (no upload)
        working-directory: apps/web
        env:
          NODE_OPTIONS: --max-old-space-size=8000   # the four countries' network in one build
        run: pnpm waterways:national | tee "$RUNNER_TEMP/build.log"

      - name: Publish a new version
        working-directory: apps/web
        env:
          DATA_BUCKET: paddlesnitch-data-prod
        run: NODE_OPTIONS=--max-old-space-size=8000 pnpm waterways:national --publish | tee -a "$RUNNER_TEMP/build.log"

      # The server's own loader (readDataset) reading the version back from S3:
      # every check route again, and the memory the dataset needs on the 2 GB
      # Lambda. One retry, so a passing blip in S3 doesn't cost a week.
      - name: Check the published version as the server will load it
        working-directory: apps/web
        env:
          DATA_BUCKET: paddlesnitch-data-prod
        run: |
          pnpm waterways:verify | tee "$RUNNER_TEMP/verify.log" && exit 0
          sleep 60
          pnpm waterways:verify | tee "$RUNNER_TEMP/verify.log"

      # A push made with GITHUB_TOKEN doesn't start other workflows, so the
      # deploy is dispatched. It runs the full test suite before it deploys and
      # its smoke test (a route on the new data) after.
      - name: Make it live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./packages/waterways/data/manifest.json').version")
          echo "version=$version" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp packages/waterways/data/manifest.json "$RUNNER_TEMP/manifest.json"
          # On top of main as it is now: it may have moved during the build.
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git switch --quiet --discard-changes --force-create publish origin/main
            cp "$RUNNER_TEMP/manifest.json" packages/waterways/data/manifest.json
            git add packages/waterways/data/manifest.json
            git commit --quiet -m "data(waterways): publish $version" -m "$(grep -E '^\s+(network|✓|✗)' "$RUNNER_TEMP/build.log" | head -40)"
            git push origin publish:main && break
            [ "$attempt" = 3 ] && { echo "::error::could not push to main"; exit 1; }
            sleep 10
          done
          started=$(date -u -d "-1 minute" +%Y-%m-%dT%H:%M:%SZ)   # a little early: clocks differ
          gh workflow run deploy.yml --ref main
          # Find that run and wait for it, so a failed deploy is reported here too.
          for i in $(seq 1 30); do
            run=$(gh run list --workflow deploy.yml --event workflow_dispatch --branch main --created ">=$started" --limit 1 --json databaseId --jq '.[0].databaseId')
            [ -n "$run" ] && break
            sleep 10
          done
          [ -n "$run" ] || { echo "::error::the deploy run didn't start"; exit 1; }
          echo "deploy run: https://github.com/${{ github.repository }}/actions/runs/$run"
          gh run watch "$run" --interval 30 > /dev/null || true
          [ "$(gh run view "$run" --json conclusion --jq .conclusion)" = success ] || { echo "::error::the deploy of $version failed: https://github.com/${{ github.repository }}/actions/runs/$run"; exit 1; }
          echo "$version is live."

      - name: Report a failed refresh
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Waterways refresh failed"
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "The weekly waterways refresh failed${version:+ with version \`$version\`}: $run_url"
            echo
            echo "If it failed before **Make it live** finished pushing, the site still serves the previous version and nothing needs undoing. If the deploy itself failed after the push, main already points at the new version: fix the deploy, or revert the \`data(waterways): publish\` commit."
            for f in verify build; do
              [ -s "$RUNNER_TEMP/$f.log" ] || continue
              echo; echo "$f (last lines):"; echo '```'; grep -v '^      via' "$RUNNER_TEMP/$f.log" | tail -40; echo '```'
            done
          } > "$RUNNER_TEMP/failed.md"
          open=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --body-file "$RUNNER_TEMP/failed.md"
          else gh issue create --title "$title" --body-file "$RUNNER_TEMP/failed.md"; fi

  # Looking for improved data: one digest issue a week of new datasets about
  # locks, weirs, slipways, canoe access and the like on data.gov.ie,
  # OpenDataNI and ArcGIS Online (packages/waterways/src/discovery.ts).
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Search the catalogues
        working-directory: apps/web
        run: pnpm waterways:discover --days 8 --out "$RUNNER_TEMP/discover.md"

      - name: Post the digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s "$RUNNER_TEMP/discover.md" ] || { echo "Nothing new this week."; exit 0; }
          gh issue create --title "Waterways data: new candidate sources $(date -u +%Y-%m-%d)" --body-file "$RUNNER_TEMP/discover.md"
