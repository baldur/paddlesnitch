name: Test and Deploy

on:
  push:
    branches: [main]
  # Redeploy main by hand (e.g. after reverting a bad change in the console).
  workflow_dispatch:

# One deploy at a time, in order. Two quick merges used to start two deploys;
# the second failed on CloudFormation's UPDATE_IN_PROGRESS and main was left
# undeployed. Queued, never cancelled: a cancelled deploy can leave the stack
# mid-update (resilience audit 2026-09).
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    # `production` is what lets this job assume the AWS deploy role (the role
    # trusts only jobs in that environment; see infra/lib/att-stack.ts). The
    # environment has no reviewers, so it never prompts.
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Install infra deps before tests: the infra-lambda vitest tests import
      # infra/lambdas/*.mjs (outside the pnpm workspace), which need infra's own
      # node_modules to resolve @aws-sdk/client-ses.
      - name: Install infra deps
        working-directory: infra
        run: npm ci

      - name: Run tests
        run: pnpm test

      # Single unified app (att now serves /att + /analyse); one OpenNext bundle.
      - name: Build OpenNext bundle
        run: pnpm build:open-next

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Deploy
        working-directory: infra
        env:
          # Platform administrators (Cognito `sub`s, comma-separated), baked into
          # the Lambda's environment at synth time. It MUST be passed here: the
          # stack reads process.env at synth, so a deploy without it would
          # silently blank the allowlist and lock everyone out of the admin
          # routes. Set it as a repository VARIABLE (Settings -> Variables), not
          # a secret — a Cognito sub is an opaque id, not a credential, and a
          # secret would be masked in every log that mentions it.
          ADMIN_USER_IDS: ${{ vars.ADMIN_USER_IDS }}
        run: npm run deploy

      # Did the site come back? Nothing checked after a deploy, so a broken
      # release was found by users. Fails the run (and emails whoever merged)
      # if the home page, Trials, the API or a static asset doesn't answer.
      - name: Smoke test
        run: |
          set -euo pipefail
          BASE=https://paddlesnitch.com
          check() { code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE$1"); echo "$1 -> $code"; [ "$code" = "$2" ]; }
          for i in 1 2 3; do check / 200 && break || sleep 15; done
          check / 200
          check /att 200
          check /guide 200
          check '/api/trpc/me' 200
          asset=$(curl -s --max-time 20 "$BASE/" | grep -oE '/_next/static/[^"]+\.js' | head -1)
          [ -n "$asset" ] && check "$asset" 200

