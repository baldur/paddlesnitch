name: Checks

# What used to run only after a merge, in the deploy job: unit tests. A PR
# could merge with a failing test, and the first anyone knew was a failed
# deploy on main (#381). Typecheck too: vitest strips types, so a type error
# in a test file merged unseen (#393). Read-only: no secrets, no AWS.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: unit tests + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The infra-lambda tests import infra/lambdas/*.mjs, which resolve from
      # infra's own node_modules (as in deploy.yml).
      - name: Install infra deps
        working-directory: infra
        run: npm ci
      - name: Unit tests
        run: pnpm test
      - name: Typecheck (app, packages, tests)
        run: pnpm typecheck
      - name: Typecheck (infra)
        working-directory: infra
        run: npx tsc --noEmit -p .

  firmware:
    name: firmware host tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Only when the PR touches firmware/: the toolchain costs a minute.
      - name: Did firmware change?
        id: changed
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}"...HEAD -- firmware/; then echo "yes=false" >> "$GITHUB_OUTPUT"; else echo "yes=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v7
        if: steps.changed.outputs.yes == 'true'
        with:
          python-version: '3.12'
      - name: Cache PlatformIO
        if: steps.changed.outputs.yes == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - if: steps.changed.outputs.yes == 'true'
        run: pip install --upgrade platformio
      - name: Host tests
        if: steps.changed.outputs.yes == 'true'
        working-directory: firmware
        run: pio test -e native
      - name: Release note fits the screen
        if: steps.changed.outputs.yes == 'true'
        run: bash .github/scripts/firmware-notes.sh firmware/NOTES
