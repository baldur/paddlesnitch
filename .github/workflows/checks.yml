name: Checks

# What used to run only after a merge, in the deploy job: unit tests. A PR
# could merge with a failing test, and the first anyone knew was a failed
# deploy on main (#381). Typecheck too: vitest strips types, so a type error
# in a test file merged unseen (#393). Read-only: no secrets, no AWS.
on:
  pull_request:
  # The weekly waterways refresh opens its PR with GITHUB_TOKEN, which doesn't
  # trigger pull_request runs; it dispatches this on its branch instead.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: unit tests + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The infra-lambda tests import infra/lambdas/*.mjs, which resolve from
      # infra's own node_modules (as in deploy.yml).
      - name: Install infra deps
        working-directory: infra
        run: npm ci
      - name: Unit tests
        run: pnpm test
      # The games (games/) are plain JS with Node's own test runner, no deps.
      - name: Game tests
        run: pnpm test:games
      # The Claude agent briefs and the role map they are routed by (docs/agents.md).
      - name: Agent role checks
        run: pnpm test:agents
      - name: Typecheck (app, packages, tests)
        run: pnpm typecheck
      # Errors fail; warnings are reported. (It used to lint the generated
      # .open-next bundle: 16,000 problems, so nobody read any of them.)
      - name: Lint
        run: pnpm lint
      - name: Typecheck (infra)
        working-directory: infra
        run: npx tsc --noEmit -p .

  firmware:
    name: firmware host tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Only when the PR touches firmware/: the toolchain costs a minute.
      - name: Did firmware change?
        id: changed
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}"...HEAD -- firmware/; then echo "yes=false" >> "$GITHUB_OUTPUT"; else echo "yes=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v7
        if: steps.changed.outputs.yes == 'true'
        with:
          python-version: '3.12'
      - name: Cache PlatformIO
        if: steps.changed.outputs.yes == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            firmware/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - if: steps.changed.outputs.yes == 'true'
        run: pip install --upgrade platformio
      - name: Host tests
        if: steps.changed.outputs.yes == 'true'
        working-directory: firmware
        run: pio test -e native
      - name: Release note fits the screen
        if: steps.changed.outputs.yes == 'true'
        run: bash .github/scripts/firmware-notes.sh firmware/NOTES
      - name: Release signing and tracker enrolment scripts
        if: steps.changed.outputs.yes == 'true'
        run: |
          bash .github/scripts/firmware-sign.test.sh
          bash firmware/tools/enroll.test.sh

  # The shared recorder core (recorder-core/): every fixture, byte for byte,
  # with gcc and clang and under the sanitizers. Seconds, so it always runs.
  # macOS is arm64, where clang fuses multiply-adds by default as the phones'
  # compilers do: the leg that proves fixtures/fp_contract holds.
  recorder-core:
    name: recorder core fixtures (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          - { os: macos-latest, cc: clang }
    steps:
      - uses: actions/checkout@v7
      - name: Fixtures
        working-directory: recorder-core
        run: make test CC=${{ matrix.cc }}
      - name: Fixtures under the sanitizers
        working-directory: recorder-core
        run: make sanitize CC=${{ matrix.cc }}

  # The core as each platform builds it. Fixtures can't run on a phone or the
  # tracker here, so this checks what decides whether they would agree: that
  # no build fuses multiply-adds (fixtures/fp_contract).
  recorder-core-builds:
    name: recorder core builds (CMake, Android, ESP32-S3, WebAssembly)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: CMake build and fixtures
        run: |
          cmake -S recorder-core -B /tmp/rc-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/rc-cmake
          ctest --test-dir /tmp/rc-cmake --output-on-failure
      - name: Android (NDK, arm64) has no fused multiply-adds
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cmake -S recorder-core -B /tmp/rc-android -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29
          cmake --build /tmp/rc-android --target recorder_core
          fused=$("$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump" -d /tmp/rc-android/librecorder_core.a \
            | grep -c -E '\b(fn?madd|fn?msub|fmla|fmls)\b' || true)
          echo "fused multiply-adds: $fused"
          test "$fused" -eq 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Cache the ESP32-S3 toolchain
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-esp32s3-toolchain-8.4.0+2021r2-patch5
      - name: ESP32-S3 has no fused multiply-adds
        run: |
          pip install --upgrade platformio
          pio pkg install --global --tool "espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5"
          bash recorder-core/test/esp32_no_fma.sh
      # The server's build: every fixture replayed through the WebAssembly
      # module under Node. wasi-sdk publishes no checksums, so it's pinned here.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: WebAssembly build and fixtures
        run: |
          curl -fsSL -o /tmp/wasi-sdk.tar.gz \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz
          echo "52640dde13599bf127a95499e61d6d640256119456d1af8897ab6725bcf3d89c  /tmp/wasi-sdk.tar.gz" | sha256sum -c -
          tar xzf /tmp/wasi-sdk.tar.gz -C /tmp
          make -C recorder-core wasm WASI_SDK=/tmp/wasi-sdk-25.0-x86_64-linux

  games:
    name: games in browsers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Only when the PR touches games/: three browsers cost a few minutes.
      - name: Did the games change?
        id: changed
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}"...HEAD -- games/; then echo "yes=false" >> "$GITHUB_OUTPUT"; else echo "yes=true" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@v6
        if: steps.changed.outputs.yes == 'true'
        with:
          version: 11
      - uses: actions/setup-node@v7
        if: steps.changed.outputs.yes == 'true'
        with:
          node-version: '22'
          cache: 'pnpm'
      - if: steps.changed.outputs.yes == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install browsers
        if: steps.changed.outputs.yes == 'true'
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium webkit firefox
      # Each game played in Chromium, WebKit and Firefox, desktop and phone,
      # with and without WebGPU and other optional features (games/tests/browsers.mjs).
      - name: Play the games
        if: steps.changed.outputs.yes == 'true'
        run: pnpm test:games:browsers
