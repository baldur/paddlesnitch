# Security audit 2026-09: nothing watched the dependencies. Weekly, grouped so
# it's one PR per ecosystem rather than one per package. Security updates
# (for a known advisory) are raised as soon as GitHub knows about them,
# regardless of this schedule, once "Dependabot security updates" is enabled
# in Settings > Code security.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major versions are projects, not routine bumps (TypeScript 7, ESLint 10
      # (crashes eslint-plugin-react), a new FIT parser, Vitest 5, @types/node,
      # which must follow the Lambda's Node 22...). Take them deliberately.
      # Minor and patch updates still come weekly, grouped.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ['*']
