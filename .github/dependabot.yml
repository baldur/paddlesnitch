# Security audit 2026-09: nothing watched the dependencies. Weekly, grouped so
# it's one PR per ecosystem rather than one per package. Security updates
# (for a known advisory) are raised as soon as GitHub knows about them,
# regardless of this schedule, once "Dependabot security updates" is enabled
# in Settings > Code security.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node's types follow the Node the Lambdas run (22, see
      # lambda-runtime.test.ts), not the newest Node. Bump by hand with the runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # ESLint 10 crashes inside eslint-plugin-react (pulled in by
      # eslint-config-next). Hold at 9 until eslint-config-next supports 10.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ['*']
