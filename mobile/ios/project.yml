# XcodeGen spec. The .xcodeproj is generated from this (`make project`) and
# not committed, so project changes are reviewable and never merge-conflict.
name: Paddlesnitch
options:
  bundleIdPrefix: com.paddlesnitch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # No team until the Developer Program (P5); the simulator needs none.
    CODE_SIGN_STYLE: Automatic
packages:
  PaddleKit:
    path: Packages/PaddleKit
targets:
  Paddlesnitch:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: PaddleKit
        product: DesignSystem
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: paddlesnitch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paddlesnitch.app
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  PaddlesnitchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UI
    dependencies:
      - target: Paddlesnitch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Paddlesnitch:
    build:
      targets:
        Paddlesnitch: all
        PaddlesnitchUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - PaddlesnitchUITests
