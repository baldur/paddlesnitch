# XcodeGen spec. The .xcodeproj is generated from this (`make project`) and
# not committed, so project changes are reviewable and never merge-conflict.
name: Paddlesnitch
options:
  bundleIdPrefix: com.paddlesnitch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # No team until the Developer Program (P5). The simulator build is signed
    # ad hoc ("-"), which needs no account but does give the app its Keychain:
    # an unsigned build can't keep the refresh token (errSecMissingEntitlement).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
packages:
  PaddleKit:
    path: Packages/PaddleKit
targets:
  Paddlesnitch:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
      # The contract's golden answers, shown as sample paddles until sign-in
      # (C2). Bundled straight from mobile/contract, never copied.
      - path: ../contract/fixtures/api
        type: folder
        buildPhase: resources
    dependencies:
      - package: PaddleKit
        product: DesignSystem
      - package: PaddleKit
        product: PaddleAPI
      - package: PaddleKit
        product: Paddles
      - package: PaddleKit
        product: Account
      - package: PaddleKit
        product: SampleServer
      - package: PaddleKit
        product: Recorder
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: paddlesnitch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        # Recording carries on with the screen off on "While Using"
        # permission: the location background mode plus a
        # CLBackgroundActivitySession, never "Always" (ios-app.md).
        UIBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: paddlesnitch uses your location to record your route while you're recording a paddle, including with the screen locked.
        # The server. A debug build can point elsewhere with the environment
        # variable PADDLESNITCH_BASE_URL (e.g. http://localhost:3000).
        PaddlesnitchBaseURL: https://paddlesnitch.com
        NSAppTransportSecurity:
          # Plain http only to this Mac's own dev server (pnpm dev).
          NSAllowsLocalNetworking: true
        # GPS files open in the app from Files, Mail, AirDrop or a share
        # sheet, and are added as paddles: the files the website reads
        # (mobile/contract/README.md). "Alternate": we're not the main app for
        # CSV or zip, only one that can open them. Copied in, not edited in
        # place.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: GPS file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.topografix.gpx
              - com.garmin.fit
              - com.garmin.tcx
              - public.comma-separated-values-text
              - public.zip-archive
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPX file
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [gpx]
              public.mime-type: [application/gpx+xml]
          - UTTypeIdentifier: com.garmin.fit
            UTTypeDescription: FIT file
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [fit]
          - UTTypeIdentifier: com.garmin.tcx
            UTTypeDescription: TCX file
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [tcx]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paddlesnitch.app
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  PaddlesnitchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UI
    dependencies:
      - target: Paddlesnitch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Paddlesnitch:
    build:
      targets:
        Paddlesnitch: all
        PaddlesnitchUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - PaddlesnitchUITests
