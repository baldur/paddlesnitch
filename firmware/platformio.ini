; LilyGO T-Beam S3 Supreme (ESP32-S3 + SX1262)
; Board definition is vendored in boards/t-beams3-supreme.json so builds do not
; depend on it being installed in the PlatformIO core directory.
;
; Two roles share one codebase, selected by environment:
;   tracker  -- reads GNSS, transmits position   (default)
;   receiver -- listens, prints one JSON line per packet
; Flash with tools/flash.sh; see CLAUDE.md for why plain `pio run -t upload` fails.

[platformio]
default_envs = tracker

; Settings shared by the three BOARD environments. Deliberately not [env],
; which would also apply to [env:native] -- native has no board and no arduino
; framework, and inheriting either makes it fail to configure.
[hw]
platform      = espressif32@7.1.1
board         = t-beams3-supreme
framework     = arduino
board_build.partitions = partitions.csv

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -DXPOWERS_CHIP_AXP2101
    -DCORE_DEBUG_LEVEL=3

    ; --- Radio ----------------------------------------------------------
    ; EU868. Change to 915.0 for US/AU. Both ends must match on every one of
    ; these or they will not hear each other.
    -DLORA_FREQ_MHZ=868.0
    -DLORA_SF=9
    -DLORA_BW_KHZ=125.0
    -DLORA_CR=5
    ; 0x12 = private network. Avoid 0x34, which is reserved for LoRaWAN.
    -DLORA_SYNCWORD=0x12
    ; Regulatory ceiling, not a tuning knob: EU868 allows 14 dBm ERP on the
    ; common sub-bands. The SX1262 can do 22 dBm and break the law.
    -DLORA_TX_DBM=14
    -DDUTY_CYCLE_PERCENT=1

lib_deps =
    mikalhart/TinyGPSPlus @ 1.1.0
    lewisxhe/XPowersLib @ 0.3.3
    olikraus/U8g2 @ 2.36.18
    jgromes/RadioLib @ 7.7.1
    lewisxhe/SensorLib
    bblanchon/ArduinoJson @ ^7.2.0

; Host-side tests. The ONLY environment that does not need the board, and the
; reason it exists: the predicate that decides whether a file is a track or a
; sidecar was wrong for a week, cost a full debugging session and five wrong
; diagnoses, and would have been caught by three lines here before the first
; flash. Run with `pio test -e native`.
;
; Keep it pure: only src/naming.cpp compiles here. Anything needing Arduino,
; the SD card or the radio belongs in a hardware env, not this one.
[env:native]
platform = native
; test_build_src is required or src/ is not compiled into the test binary at
; all and naming.cpp fails to link.
test_build_src = yes
build_src_filter = +<naming.cpp>
build_flags = -std=gnu++17 -Isrc

[env:tracker]
extends = hw
build_src_filter = +<*> -<main_receiver.cpp> -<main_displayprobe.cpp>
build_flags = ${hw.build_flags}
    -DROLE_TRACKER=1
    -DFIRMWARE_VERSION=\"0.9.0\"
    -DTX_INTERVAL_S=30

[env:receiver]
extends = hw
build_src_filter = +<*> -<main_tracker.cpp> -<main_displayprobe.cpp> -<netcfg.cpp> -<uplink.cpp> -<storage.cpp> -<imu.cpp>
build_flags = ${hw.build_flags}
    -DROLE_RECEIVER=1

; Diagnostic: identify the OLED controller/address. See src/main_displayprobe.cpp
[env:displayprobe]
extends = hw
build_src_filter = +<*> -<main_tracker.cpp> -<main_receiver.cpp> -<netcfg.cpp> -<uplink.cpp> -<storage.cpp> -<imu.cpp>
build_flags = ${hw.build_flags}
